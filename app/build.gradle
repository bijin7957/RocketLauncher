apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// Release signing comes from environment variables (GitHub Actions) or, on the developer's
// machine, ~/.android-keys/rocketlauncher-release.properties. Without either, release builds
// are left unsigned.
def signingProps = new Properties()
def signingFile = new File(System.getProperty("user.home"), ".android-keys/rocketlauncher-release.properties")
if (signingFile.exists()) signingFile.withInputStream { signingProps.load(it) }
def signingValue = { String key -> System.getenv(key) ?: signingProps.getProperty(key) }
def canSignRelease = signingValue("RELEASE_STORE_FILE") != null

android {
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        applicationId "app.rocketlauncher"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 1
        versionName "1.0.0"

        resourceConfigurations += ["en", "ar", "cs", "da", "de", "el", "es-rES", "es-rUS", "fi", "fr", "he", "hi", "hr", "hu", "in", "it", "ja", "ko", "nb", "nl", "pl", "pt-rBR", "ro", "ru-rRU", "sv", "th", "tr", "uk", "vi", "zh"]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (canSignRelease) {
                storeFile file(signingValue("RELEASE_STORE_FILE"))
                storePassword signingValue("RELEASE_STORE_PASSWORD")
                keyAlias signingValue("RELEASE_KEY_ALIAS")
                keyPassword signingValue("RELEASE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            if (canSignRelease) signingConfig signingConfigs.release
            debuggable false
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            minifyEnabled false
            applicationIdSuffix ".debug"
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        viewBinding = true
        buildConfig = true
    }
    dependenciesInfo {
        includeInApk = false
        includeInBundle = true
    }
    namespace 'app.olauncher'
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation libs.kotlin.stdlib
    implementation libs.core.ktx
    implementation libs.appcompat
    implementation libs.recyclerview

    // Android lifecycle
    implementation libs.lifecycle.extensions
    implementation libs.lifecycle.viewmodel.ktx

    // Navigation
    implementation libs.navigation.fragment.ktx

    // Work Manager
    implementation libs.work.runtime.ktx

    //Material dependency
    implementation libs.material

    testImplementation libs.junit
}
