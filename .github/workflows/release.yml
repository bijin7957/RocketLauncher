name: Release

# Pushing a tag like v1.0.0 builds the APK, signs it with the release key and publishes it as a
# GitHub release. Tags with a suffix, like v1.1.0-beta.1, are published as pre-releases.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Check the tag matches the app version
        run: |
          version=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match versionName $version in app/build.gradle"
            exit 1
          fi

      - name: Restore the signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::The RELEASE_KEYSTORE_BASE64 secret is missing, see RELEASING.md"
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build the signed APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      # Guards against publishing an APK signed with any other key, which couldn't update installs
      - name: Check the APK is signed with the release key
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          digest=$("$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk \
            | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
          if [ "$digest" != "442f884f5a5d01704827b227fd26a336fce40b464e5d9a6ed5b1bbe0e98451d0" ]; then
            echo "::error::APK is signed with an unexpected certificate: $digest"
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="RocketLauncher-$GITHUB_REF_NAME.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "$apk" --verify-tag $prerelease \
            --title "RocketLauncher $GITHUB_REF_NAME" --generate-notes
